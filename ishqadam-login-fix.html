<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISHQADAM — Kirish tuzatmasi</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f8fc;color:#14243a;margin:0;padding:24px}
main{max-width:560px;margin:40px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #183b5b18}
button{border:0;border-radius:10px;padding:12px 18px;background:#168bd2;color:white;font-weight:700;cursor:pointer}
input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;border:1px solid #cbd7e2;border-radius:9px}
.muted{color:#617287;font-size:14px}.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>ISHQADAM</h1>
<p>Hisobga kirish va profil holatini tekshirish uchun yangilangan kod.</p>
<div id="authArea">
<form id="loginForm">
<input name="email" type="email" placeholder="Email" required>
<input name="password" type="password" placeholder="Parol" required>
<button type="submit">Kirish</button>
</form>
</div>
<div id="profileArea" class="hidden">
<p id="userEmail"></p>
<button id="logoutButton" type="button">Hisobdan chiqish</button>
</div>
<p class="muted" id="message">Kirish holati tekshirilmoqda…</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://dvzlchmnyprrphwqjsfe.supabase.co";
const SUPABASE_KEY = "sb_publishable_rs5agJXY1huZGAtv_6TUrA_HAEbvZWi";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function renderSession(session) {
  const signedIn = Boolean(session && session.user);
  document.getElementById("authArea").classList.toggle("hidden", signedIn);
  document.getElementById("profileArea").classList.toggle("hidden", !signedIn);
  document.getElementById("userEmail").textContent =
    signedIn ? "Hisobga kirilgan: " + (session.user.email || "") : "";
  document.getElementById("message").textContent =
    signedIn ? "Kirish muvaffaqiyatli. Sessiya saqlangan." : "Hisobga kirmagansiz.";
}

document.getElementById("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = new FormData(event.currentTarget);
  const message = document.getElementById("message");
  message.textContent = "Tekshirilmoqda…";
  const { data, error } = await db.auth.signInWithPassword({
    email: form.get("email"),
    password: form.get("password")
  });
  if (error) {
    message.textContent = "Kirish xatosi: " + error.message;
    return;
  }
  renderSession(data.session);
});

document.getElementById("logoutButton").addEventListener("click", async () => {
  const { error } = await db.auth.signOut();
  if (error) {
    document.getElementById("message").textContent = "Chiqish xatosi: " + error.message;
    return;
  }
  renderSession(null);
});

db.auth.getSession().then(({ data, error }) => {
  if (error) {
    document.getElementById("message").textContent = "Sessiyani tekshirish xatosi: " + error.message;
    return;
  }
  renderSession(data.session);
});
db.auth.onAuthStateChange((_event, session) => renderSession(session));
</script>
</body>
</html>
